name: AUv3Probe

options:
  bundleIdPrefix: com.teemow
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# swift-atomics powers the lock-free ring buffer in ProbeKit (the iOS 16 floor
# predates the stdlib Synchronization module). xcodebuild resolves it via SPM.
packages:
  Atomics:
    url: https://github.com/apple/swift-atomics.git
    from: "1.3.0"
  # On-device AUM .aumproj / .aum_midimap reader, factored out into a standalone
  # package. Only the app target inspects sessions, so only AUv3Probe links it.
  AUMSession:
    url: https://github.com/teemow/aum-session-swift.git
    from: "0.1.0"
  # AUv3 host/environment introspection, factored out into a standalone package.
  # ProbeKit depends on it and re-exports it (HostIntrospectionExport.swift).
  AUv3HostIntrospection:
    url: https://github.com/teemow/auv3-host-introspection.git
    from: "0.1.2"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  # Shared library: design system, LAN client, data contracts, realtime AUv3
  # helpers. Built as a framework the app embeds once and both extensions link.
  ProbeKit:
    type: framework
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources/ProbeKit
    dependencies:
      - package: Atomics
        product: Atomics
      - package: AUv3HostIntrospection
        product: AUv3HostIntrospection
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teemow.auv3probe.ProbeKit
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  # The container app (jobs 1 + 2 + authoring). Embeds ProbeKit + both appex.
  AUv3Probe:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources/AUv3ProbeApp
      - Resources
    dependencies:
      - target: ProbeKit
      - target: ProbeMidiBrain
      - target: ProbeAudioTap
      - package: AUMSession
        product: AUMSession
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teemow.auv3probe
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Inter-App Audio capability — required for third-party AUv3 discovery
        # (see Resources/AUv3Probe.entitlements and docs/auv3-discovery.md).
        CODE_SIGN_ENTITLEMENTS: Resources/AUv3Probe.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  # ProbeMidiBrain — `aumi` MIDI-processor app extension. XcodeGen generates a
  # complete Info.plist from the `info.properties` below (the NSExtension /
  # AudioComponents registration); the xtool build uses Extensions/ProbeMidiBrain-Info.plist.
  ProbeMidiBrain:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources/ProbeMidiBrain
    dependencies:
      - target: ProbeKit
        embed: false
    info:
      path: Generated/ProbeMidiBrain-Info.plist
      properties:
        CFBundleDisplayName: ProbeMidiBrain
        NSLocalNetworkUsageDescription: ProbeMidiBrain finds your mcp-midi-controller on the local network to receive MIDI.
        NSBonjourServices:
          - _mcpmidi._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: ProbeMidiBrainViewController
          NSExtensionAttributes:
            AudioComponents:
              - name: "Tmow: ProbeMidiBrain"
                description: Song-aware scene driver (MIDI processor)
                factoryFunction: ProbeMidiBrainViewController
                manufacturer: Tmow
                type: aumi
                subtype: pbMi
                version: 1
                sandboxSafe: true
                tags: [MIDI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teemow.auv3probe.MidiBrain
        CODE_SIGN_ENTITLEMENTS: Resources/AUv3Probe.entitlements

  # ProbeAudioTap — `aufx` audio-effect app extension (transparent tap + stream).
  ProbeAudioTap:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources/ProbeAudioTap
    dependencies:
      - target: ProbeKit
        embed: false
    info:
      path: Generated/ProbeAudioTap-Info.plist
      properties:
        CFBundleDisplayName: ProbeAudioTap
        NSLocalNetworkUsageDescription: ProbeAudioTap finds your mcp-midi-controller on the local network to stream audio.
        NSBonjourServices:
          - _mcpmidi._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: ProbeAudioTapViewController
          NSExtensionAttributes:
            AudioComponents:
              - name: "Tmow: ProbeAudioTap"
                description: Transparent audio tap that streams PCM + features over the LAN
                factoryFunction: ProbeAudioTapViewController
                manufacturer: Tmow
                type: aufx
                subtype: pbAu
                version: 1
                sandboxSafe: true
                tags: [Effects]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teemow.auv3probe.AudioTap
        CODE_SIGN_ENTITLEMENTS: Resources/AUv3Probe.entitlements
