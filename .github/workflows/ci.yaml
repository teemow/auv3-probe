name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (iOS, no signing)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test purchase progress reporting
        run: python3 -m unittest discover -s Tests/Scripts -p 'test_ipad_buy.py' -v

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project AUv3Probe.xcodeproj \
            -scheme AUv3Probe \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      # ProbeKit uses iOS-only APIs, so its unit tests run on an iOS simulator
      # (not `swift test` on the macOS host). Picks the first available iPhone
      # simulator so the step survives the runner's Xcode updates.
      - name: Test (iOS simulator)
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "simulator: $udid"
          xcodebuild \
            -project AUv3Probe.xcodeproj \
            -scheme AUv3Probe \
            -destination "id=$udid" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
